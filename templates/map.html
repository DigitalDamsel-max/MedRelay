{% extends "base.html" %}
{% block title %}Find Pharmacies Near You — MedRelay{% endblock %}
{% block head %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
body,.page{overflow:hidden}
@media(max-width:960px){body,.page{overflow:auto}.map-layout{grid-template-columns:1fr;grid-template-rows:48vh auto;height:auto}.map-sidebar{max-height:55vh;order:2}.map-container{order:1;min-height:48vh}}

  .map-search-wrap {
    position: relative; /* Needed for absolute positioning of the icon */
    width: 300px; /* Adjust as needed */
  }

  .map-search-wrap .s-icon {
    position: absolute;
    left: 10px; /* Distance from left edge */
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none; /* Prevent icon from blocking input clicks */
    font-size: 16px;
    color: #888;
  }

  .map-search-wrap .form-input {
    width: 100%;
    padding: 8px 8px 8px 32px; /* Left padding to make space for icon */
    box-sizing: border-box;
    font-size: 14px;
  }
</style>
{% endblock %}
{% block body %}
<div class="page">
<div class="map-layout">

  <aside class="map-sidebar">
    <div class="map-sidebar-head">
      <h2>Pharmacies Near You</h2>
      <div class="map-search-wrap">
        <span class="s-icon">🔍</span>
        <input class="form-input" id="mapSearch" type="text" placeholder="Search by name, area or phone…" autocomplete="off">
      </div>
      <div class="sidebar-meta">
        <span>Found <strong id="pharmCount">…</strong> pharmacies</span>
      </div>
    </div>
    <div id="pharmList"></div>
  </aside>

  <div class="map-container">
    <div id="mapEl"></div>
    <button class="map-fab" id="locateBtn">📍 Locate Me</button>
    <div class="map-radius-bar">
      <span>Radius</span>
      <input type="range" id="mapRadius" min="1" max="20" value="3">
      <span id="mapRadiusVal"></span>
    </div>
  </div>

</div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="{{ url_for('static', filename='js/map.js') }}"></script>
{% endblock %}
