<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}MedRelay{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>

<!-- ── NAVIGATION ── -->
<nav class="nav" id="mainNav">
  <a href="{{ url_for('index') }}" class="nav-logo">
    <div class="nav-logo-mark">💊</div>
    <div class="nav-logo-text"><em>Med</em><span>Relay</span></div>
  </a>
  <ul class="nav-links">
    <li><a href="{{ url_for('index') }}">Home</a></li>
    <li><a href="{{ url_for('upload_page') }}">Upload Rx</a></li>
    <li><a href="{{ url_for('map_page') }}">Find Pharmacy</a></li>
    <li><a href="{{ url_for('responses_page') }}">Responses</a></li>
   </ul>

  {% if session.get('customer_id') %}
    <span class="nav-user">Hi, {{ session.get('customer_name') }}</span>
    <button class="nav-cta" onclick="window.location.href='{{ url_for('customer_logout_page') }}'">Logout</button>
  {% else %}
    <button class="nav-cta" onclick="window.location.href='{{ url_for('customer_login_page') }}'">Login</button>
  {% endif %}

  <button class="nav-burger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

{% block body %}{% endblock %}

<div id="toast"></div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
